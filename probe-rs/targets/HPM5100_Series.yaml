name: HPM5100 Series
variants:
- name: HPM5151
  jtag:
    scan_chain:
    - name: cpu
      ir_len: 5
  cores:
  - name: core0
    type: riscv
    core_access_options: !Riscv {}
  memory_map:
  - !Ram
    name: ILM0
    range:
      start: 0x0
      end: 0x40000
    cores:
    - core0
  - !Ram
    name: DLM0
    range:
      start: 0x00200000
      end: 0x00220000
    cores:
    - core0
  - !Ram
    name: AHB_SRAM
    range:
      start: 0xF0200000
      end: 0xF0208000
    cores:
    - core0
  - !Nvm
    name: XPI0
    range:
      start: 0x80000000
      end: 0x80100000
    is_boot_memory: true
    cores:
    - core0
  flash_algorithms:
  - flash-algo-hpm51x1
flash_algorithms:
- name: flash-algo-hpm51x1
  description: flash algorithm for HPM51x1 series (self-contained FLM image, XPI0 controller at 0xF00E0000)
  default: true
  instructions: 
  load_address: 0x20
  # The ROM program command reads the source buffer with DMA. Buffers
  # in the core-local ILM hang the command on this part, so keep the
  # data buffers in the DLM, which the XPI master can reach and which
  # is large enough to hold whole image batches.
  data_load_address: 0x00200000
  pc_init: 0x63a
  pc_uninit: 0x6aa
  pc_program_page: 0x6ec
  pc_erase_sector: 0x6c6
  pc_erase_all: 0x812
  data_section_offset: 0x1110
  flash_properties:
    address_range:
      start: 0x80000000
      end: 0x80100000
    page_size: 0x100
    erased_byte_value: 0xff
    program_page_timeout: 1000
    erase_sector_timeout: 2000
    sectors:
    - size: 0x1000
      address: 0x0
  cores:
  - core0
